<title>Never the Same Twice — Intuition Machine</title>
<meta name="description" content="A 97-second film from Intuition Machine, built from the Chair44 aperiodic monotile.">

<!-- self-hosted: the site makes no third-party requests at page load -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --night:#04110F; --deep:#0A2420; --mist:#E6F1ED; --mist-soft:#8FB3A9; --teal:#0E4A44; --mint:#93CABD; --paper:#F8F7F2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#F2F1EB; } }
:root[data-theme="dark"]{ --paper:#F2F1EB; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#000;color:var(--mist);overflow:hidden;
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif}
.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--night);touch-action:none}
canvas{display:block;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.lowshade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;background:linear-gradient(to top,rgba(2,10,9,.62),rgba(2,10,9,0))}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.08;mix-blend-mode:overlay}
.bar-top,.bar-bot{position:absolute;left:0;right:0;height:0;background:#000;pointer-events:none;z-index:5}
.bar-top{top:0}.bar-bot{bottom:0}
.title{position:absolute;left:50%;transform:translateX(-50%);width:min(24em,88%);text-align:center;
  font-family:'Source Serif 4',Georgia,serif;font-weight:300;font-size:clamp(22px,3.1vw,44px);line-height:1.22;
  letter-spacing:.005em;color:var(--mist);text-shadow:0 2px 24px rgba(0,0,0,.6);
  transition:opacity .7s ease, filter .7s ease;pointer-events:none;z-index:4;text-wrap:balance}
.title.mid{top:50%;margin-top:-.7em}
.title.low{bottom:calc(var(--bar,0px) + clamp(22px,6vh,64px))}
.title.hide{opacity:0;filter:blur(8px)}
.title em{font-style:italic;color:var(--mint)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.endcard{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.endcard img{width:min(520px,78%);height:auto;margin-bottom:clamp(14px,3vh,30px)}
.endcard .line{font-family:'Source Serif 4',Georgia,serif;color:var(--teal);opacity:0;transition:opacity 1.2s}
.endcard .line.on{opacity:1}
.endcard .l1{font-size:clamp(20px,2.4vw,32px);font-weight:400}
.endcard .l2{font-size:clamp(16px,1.7vw,22px);font-style:italic;font-weight:300;margin-top:.35em;color:#2E6B62}
.endcard .l3{font-family:'Archivo',system-ui,sans-serif;font-size:clamp(13px,1.2vw,15px);font-weight:600;letter-spacing:.04em;margin-top:1.4em}
.endcard .credit{position:absolute;bottom:calc(var(--bar,0px) + 14px);left:0;right:0;font-size:11px;color:#6E857F;opacity:0;transition:opacity 1.2s;padding:0 16px}
.endcard .credit.on{opacity:1}
.gate{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,#0B2723 0%,#04110F 70%);transition:opacity .8s;text-align:center;padding:24px}
.gate.gone{opacity:0;pointer-events:none}
.gate h1{font-family:'Source Serif 4',Georgia,serif;font-weight:300;font-size:clamp(30px,5vw,60px);margin:0;letter-spacing:-.005em}
.gate h1 em{color:var(--mint)}
.gate p{margin:0;color:var(--mist-soft);font-size:15px}
.cta{font:600 16px 'Archivo',system-ui,sans-serif;background:var(--mist);color:#062521;border:0;
  padding:.9em 1.5em;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:.6em;margin-top:8px}
.cta:hover{background:#fff}
.controls{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px) 12px;background:#000;color:var(--mist)}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(230,241,237,.25);background:transparent;color:var(--mist);cursor:pointer;display:grid;place-items:center;flex:none}
.btn:hover{background:rgba(230,241,237,.1)}
button:focus-visible,.track:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.track{position:relative;flex:1;height:30px;cursor:pointer;display:flex;align-items:center}
.rail{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:rgba(230,241,237,.18);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--mint);border-radius:2px}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mist-soft);min-width:78px;text-align:right}
</style>
</head>

   const n=noiseSrc(S),bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.5;env(bp.frequency,[[0,300],[e.d,7000]],vt,when,into);
   const g=gainTo(S,0,.6);env(g.gain,[[0,0],[e.d*.85,.28],[e.d,.34]],vt,when,into);n.connect(bp);bp.connect(g);n.start(when);n.stop(end);
   const o=mk(S,'sine',200);env(o.frequency,[[0,180],[e.d,880]],vt,when,into);const og=gainTo(S,0,.4);env(og.gain,[[0,0],[e.d,.1]],vt,when,into);o.connect(og);o.start(when);o.stop(end);},

   const g=gainTo(S,0,.35);g.gain.setValueAtTime(g0,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);o.connect(g);o.start(t);o.stop(t+1.6);
   const n=noiseSrc(S),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1000;const ng=gainTo(S,0,.5);
   ng.gain.setValueAtTime(.55*g0,t);ng.gain.exponentialRampToValueAtTime(.001,t+.6);n.connect(lp);lp.connect(ng);n.start(t);n.stop(t+.7);},

   const sh=ctx.createWaveShaper();sh.curve=A.curve;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.5;
   lp.frequency.setValueAtTime(120,t);lp.frequency.exponentialRampToValueAtTime(2400,t+.22);lp.frequency.exponentialRampToValueAtTime(220,t+len);
   const g=gainTo(S,0,.55);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(g0,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+len);
   sh.connect(lp);lp.connect(g);
   for(const r of[1,1.498,2.004,.5]){const o=mk(S,r===.5?'sine':'sawtooth',f*r);const og=ctx.createGain();og.gain.value=r===.5?.9:.35;o.connect(og);og.connect(sh);o.start(t);o.stop(t+len+.1);}},
 tick(S,t,into,e){const o=mk(S,'square',e.f||2600),hp=S.ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;
   const g=gainTo(S,0,.12);g.gain.setValueAtTime(e.g||.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(hp);hp.connect(g);o.start(t);o.stop(t+.05);},
 thump(S,t,into,e){const f=e.f||52,o=mk(S,'sine',f*1.7);o.frequency.setValueAtTime(f*1.7,t);o.frequency.exponentialRampToValueAtTime(f,t+.1);
   const g=gainTo(S,0,.1);g.gain.setValueAtTime(e.g||.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);o.start(t);o.stop(t+.45);},
 clack(S,t){const ctx=S.ctx,n=noiseSrc(S),bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=4;
   const g=gainTo(S,0,.5);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);n.connect(bp);bp.connect(g);n.start(t);n.stop(t+.1);
   const o=mk(S,'sine',950);o.frequency.setValueAtTime(950,t);o.frequency.exponentialRampToValueAtTime(420,t+.08);const og=gainTo(S,0,.4);
   og.gain.setValueAtTime(.35,t);og.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(og);o.start(t);o.stop(t+.16);SND.thump(S,t,0,{f:60,g:.7});},
 pluck(S,t,into,e){const ctx=S.ctx,g=gainTo(S,0,.75);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(e.g||.22,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+(e.len||1.8));
   const a=mk(S,'triangle',e.f),b=mk(S,'sine',e.f*2.002);const bg=ctx.createGain();bg.gain.value=.25;a.connect(g);b.connect(bg);bg.connect(g);
   a.start(t);b.start(t);a.stop(t+(e.len||1.8)+.05);b.stop(t+(e.len||1.8)+.05);},

 crash(S,t,into,e){const ctx=S.ctx,n=noiseSrc(S),hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;
   const g=gainTo(S,0,.7);g.gain.setValueAtTime(e.g||.5,t);g.gain.exponentialRampToValueAtTime(.001,t+(e.len||2.6));n.connect(hp);hp.connect(g);n.start(t);n.stop(t+(e.len||2.6)+.1);},
};

ev(48.2,'drone',{d:5.4,f:82.41,g:[[0,0],[1.5,.18],[5.2,.4],[5.35,0]],cut:[[0,400],[5.2,3000]]});
{let t=48.5,i=0;while(t<53.45){const dens=.28-.24*((t-48.5)/5);ev(t,'blip',{f:220+hash(i)*1800,g:.05+.07*hash(i+9),len:.02+.05*hash(i+3)});t+=Math.max(.035,dens*(.6+.8*hash(i+5)));i++;}}

const LONG={drone:1,pad:1,riser:1};

function startSession(T){
  if(!A.ctx)return;stopSession();const ctx=A.ctx;const S={ctx,bus:ctx.createGain(),send:ctx.createGain(),srcs:[]};
  S.bus.connect(A.out);S.send.connect(A.rev);A.sess=S;const now=ctx.currentTime+.06;
  for(const e of EV){const into=T-e.t;
    if(LONG[e.k]){if(into>=e.d)continue;}else if(into>.03)continue;
    SND[e.k](S,now+Math.max(0,-into),Math.max(0,into),e);}
}
function stopSession(){const S=A.sess;if(!S)return;A.sess=null;const t=A.ctx.currentTime;
  S.bus.gain.setTargetAtTime(0,t,.03);S.send.gain.setTargetAtTime(0,t,.03);
  S.srcs.forEach(s=>{try{s.stop(t+.25);}catch(e){}});setTimeout(()=>{S.bus.disconnect();S.send.disconnect();},800);}

/* ================= UI ================= */
const titleEl=document.getElementById('title'),flashEl=document.getElementById('flash'),endEl=document.getElementById('end');
const eLines=['e1','e2','e3','e4'].map(id=>document.getElementById(id));
const gate=document.getElementById('gate'),playBtn=document.getElementById('play'),picon=document.getElementById('picon');
const muteBtn=document.getElementById('mute'),micon=document.getElementById('micon');
const fill=document.getElementById('fill'),clock=document.getElementById('clock'),track=document.getElementById('track');
const bt=document.getElementById('bt'),bb=document.getElementById('bb'),grain=document.getElementById('grain');
let T=0,playing=false,started=false;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const I_PLAY='<path d="M1 1l12 7-12 7z" fill="currentColor"/>',I_PAUSE='<rect x="1" y="1" width="4" height="14" fill="currentColor"/><rect x="9" y="1" width="4" height="14" fill="currentColor"/>',
 I_REPLAY='<path d="M7 2.2a5.8 5.8 0 1 1-5.8 5.8h1.9A3.9 3.9 0 1 0 7 4.1v2.4L3.2 3.3 7-.1z" fill="currentColor"/>';
const I_SOUND='<path d="M1 5.5h3.2L8.5 2v12L4.2 10.5H1z" fill="currentColor"/><path d="M11 5a4 4 0 0 1 0 6M13.2 3a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>',
 I_MUTED='<path d="M1 5.5h3.2L8.5 2v12L4.2 10.5H1z" fill="currentColor"/><path d="M11.5 5.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
micon.innerHTML=I_SOUND;
function setPlaying(p){
  if(p){audioInit();if(A.ctx.state==='suspended')A.ctx.resume();if(T>=TOTAL-.01)T=0;if(!started){started=true;gate.classList.add('gone');}startSession(T);}
  else stopSession();
  playing=p;picon.innerHTML=p?I_PAUSE:(T>=TOTAL-.01?I_REPLAY:I_PLAY);playBtn.setAttribute('aria-label',p?'Pause':'Play');
}
document.getElementById('go').onclick=()=>setPlaying(true);
playBtn.onclick=()=>setPlaying(!playing);
muteBtn.onclick=()=>{A.muted=!A.muted;if(A.out)A.out.gain.setTargetAtTime(A.muted?0:VOL,A.ctx.currentTime,.03);micon.innerHTML=A.muted?I_MUTED:I_SOUND;muteBtn.setAttribute('aria-label',A.muted?'Unmute':'Mute');};
let scrub=false,wasPlaying=false;
function seekTo(x){const r=track.getBoundingClientRect();T=clamp((x-r.left)/r.width)*TOTAL;if(!started){started=true;gate.classList.add('gone');}}
track.addEventListener('pointerdown',e=>{scrub=true;wasPlaying=playing;if(playing)setPlaying(false);track.setPointerCapture(e.pointerId);seekTo(e.clientX);});
track.addEventListener('pointermove',e=>{if(scrub)seekTo(e.clientX);});
track.addEventListener('pointerup',()=>{scrub=false;if(wasPlaying)setPlaying(true);});
function jump(dt){const p=playing;if(p)stopSession();T=clamp(T+dt,0,TOTAL);if(p)startSession(T);}
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){jump(5);e.preventDefault();}if(e.key==='ArrowLeft'){jump(-5);e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.target===track)return;if(e.key===' '||e.key==='k'){e.preventDefault();setPlaying(!playing);}if(e.key==='m')muteBtn.click();});

{const g=document.createElement('canvas');g.width=g.height=180;const x=g.getContext('2d'),im=x.createImageData(180,180);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}

let barPx=0;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  barPx=Math.max(0,Math.round((h-w/2.2)/2));barPx=Math.min(barPx,h*.14);bt.style.height=bb.style.height=barPx+'px';stage.style.setProperty('--bar',barPx+'px');}
new ResizeObserver(resize).observe(stage);resize();

let lastLine=null,last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;setPlaying(false);}}
  const tt=Math.min(T,TOTAL-1e-4);
  ALL.forEach(s=>s.group.visible=false);
  const sc=SCENES.find(s=>tt>=s.t0&&tt<s.t1)||SCENES[SCENES.length-1];
  const sh=sc.run(tt);
  // camera, with a dolly-zoom toward a flat isometric view for the final reveal
  const iso=sh.iso||0,fov=32-22*iso;if(Math.abs(camera.fov-fov)>1e-3){camera.fov=fov;camera.updateProjectionMatrix();}
  let d=sh.d*Math.tan(16*Math.PI/180)/Math.tan(fov*Math.PI/360);
  if(camera.aspect<1.3)d*=Math.pow(1.3/camera.aspect,.85);
  d*=1.18;const ty=(sh.ty||0)*(1-iso)-.025*d*(1-iso);

  if(sh.shake&&!RM){const a=sh.shake*.012*d;camera.position.x+=(hash(Math.floor(tt*60))-.5)*a;camera.position.y+=(hash(Math.floor(tt*60)+3)-.5)*a;}
  camera.lookAt(0,ty,0);
  // lights: key spot follows the camera from upper left; in the reveal it swings right to echo the logo's shading
  const S=sh.S,ca=Math.cos(sh.az),sa=Math.sin(sh.az);
  const lr=-.55+1.75*iso,lb=.8-.2*iso,lu=1-.62*iso; // camera-right, camera-back (horizontal), world-up
  key.position.set((ca*lr+sa*lb)*S*1.6,lu*S*1.6,(-sa*lr+ca*lb)*S*1.6);
  key.intensity=sh.keyI*(1-.2*iso);key.color.setHex(sh.keyC||0xffffff);key.shadow.camera.near=S*.4;key.shadow.camera.far=S*5;key.shadow.normalBias=.012*S;
  rim.position.set(-sa*S,S*.8,-ca*S);rim.intensity=sh.rimI;hemi.intensity=sh.hemiI*1.45+.2*iso;
  floor.position.y=sh.floorY;floor.visible=iso<.5;

  const L=started?LINES.find(l=>tt>=l[0]&&tt<l[1]):null,txt=L?L[3]:'';
  if(txt!==lastLine){lastLine=txt;titleEl.classList.add('hide');
    setTimeout(()=>{if(lastLine!==txt)return;titleEl.innerHTML=txt;titleEl.className='title '+(L?L[2]:'mid')+(txt?'':' hide');},txt?320:0);}
  // flash and end card
  const f=tt<86.2?0:tt<86.32?(tt-86.2)/.12:Math.max(0,1-(tt-86.32)/1.1);flashEl.style.opacity=f;
  const endOn=tt>=86.3;endEl.style.opacity=endOn?1:0;
  [87.4,89.9,92.3,93.5].forEach((s,i)=>eLines[i].classList.toggle('on',tt>=s));
  if(playing&&!RM)grain.style.transform='translate('+(hash(Math.floor(now/40))*60-30)+'px,'+(hash(Math.floor(now/40)+1)*60-30)+'px)';
  fill.style.width=(T/TOTAL*100)+'%';clock.textContent=fmt(T)+' / '+fmt(TOTAL);track.setAttribute('aria-valuenow',Math.round(T/TOTAL*100));
  requestAnimationFrame(frame);
}
